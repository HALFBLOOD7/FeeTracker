
name: Build Fee Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          unzip -q fee-tracker-build.zip -d extracted

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p extracted/fee-tracker-build \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fee-tracker-apk
          path: extracted/fee-tracker-build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
